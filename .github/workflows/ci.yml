name: Test environment verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Contracts, quality and build on test environment
    runs-on: [self-hosted, linux, spark-x-test-env]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run repository checks
        run: npm run check

      - name: Validate Compose model
        run: npm run compose:config

  container-build:
    name: Container build on test environment
    runs-on: [self-hosted, linux, spark-x-test-env]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Build immutable service image
        run: docker build -f infra/compose/Dockerfile.service -t spark-x-test-platform-service:ci .

      - name: Build immutable web image
        run: docker build -f infra/compose/Dockerfile.web -t spark-x-test-platform-web:ci .
